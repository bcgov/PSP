{
    "kind": "List",
    "apiVersion": "v1",
    "metadata": {},
    "items": [
        {
            "apiVersion": "image.openshift.io/v1",
            "kind": "ImageStream",
            "metadata": {
                "labels": {
                    "app": "proxy-caddy",
                    "env": "tools",
                    "name": "proxy-caddy",
                    "role": "web-server"
                },
                "name": "proxy-caddy",
                "namespace": "3cd915-tools"
            },
            "spec": {
                "lookupPolicy": {
                    "local": false
                }
            },
            "status": {
                "dockerImageRepository": ""
            }
        },
        {
            "apiVersion": "build.openshift.io/v1",
            "kind": "BuildConfig",
            "metadata": {
                "labels": {
                    "app": "proxy-caddy",
                    "env": "tools",
                    "name": "proxy-caddy",
                    "role": "web-server"
                },
                "name": "proxy-caddy.dev",
                "namespace": "3cd915-tools"
            },
            "spec": {
                "failedBuildsHistoryLimit": 5,
                "nodeSelector": null,
                "output": {
                    "to": {
                        "kind": "ImageStreamTag",
                        "name": "proxy-caddy:dev"
                    }
                },
                "postCommit": {},
                "resources": {
                    "limits": {
                        "cpu": "1",
                        "memory": "6Gi"
                    }
                },
                "runPolicy": "SerialLatestOnly",
                "source": {
                    "contextDir": "tools/cicd/maintenance",
                    "git": {
                        "ref": "dev",
                        "uri": "https://github.com/bcgov/psp.git"
                    },
                    "type": "Git"
                },
                "strategy": {
                    "dockerStrategy": {
                        "dockerfilePath": "Dockerfile"
                    },
                    "type": "Docker"
                },
                "successfulBuildsHistoryLimit": 5,
                "triggers": [
                    {
                        "type": "ConfigChange"
                    }
                ]
            }
        }
    ]
}
