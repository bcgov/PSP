---
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: proxy-caddy-build-config
parameters:
  - name: APP_NAME
    displayName: "Maintenance Caddy Name"
    description: "The name used for deployments in OpenShift."
    required: true
    value: "proxy-caddy"

  - name: ROLE_NAME
    displayName: Role Name
    description: The name of the application component role (e.g ui, web, api, database).
    required: true
    value: web-server

  - name: PROJECT_NAMESPACE
    displayName: "OpenShift Project Namespace"
    description: "The namespace of the OpenShift project containing the application."
    required: true
    value: "3cd915"

  - name: ENV_NAME
    displayName: "Environment name"
    description: "The name for this environment [dev, test, prod, tools]"
    required: true
    value: "dev"

  - name: IMAGE_TAG
    displayName: "Image Tag Name"
    description: "The image tag that will be used for this deployment.
      This provides a way to setup an environment for other branches."
    value: "dev"

  - name: APP_DOMAIN
    displayName: "Application Hostname"
    description:
      "The exposed hostname that will route to the the React frontend, if left blank a
      value will be defaulted."
    value: ""

  - name: APP_PORT
    displayName: "Application Port"
    description: "The port used to communicate with the Pod"
    value: "2015"

  - name: CPU_REQUEST
    displayName: "CPU Request"
    description: "Starting amount of CPU the container can use."
    value: "100m"

  - name: CPU_LIMIT
    displayName: "CPU Limit"
    description: "Maximum amount of CPU the container can use."
    value: "1"

  - name: MEMORY_REQUEST
    displayName: "Memory Request"
    description: "Starting amount of memory the container can use."
    value: "500Mi"

  - name: MEMORY_LIMIT
    displayName: "Memory Limit"
    description: "Maximum amount of memory the container can use."
    value: "4Gi"

objects:
  # Configure port communication to the pod.
  - kind: Service
    apiVersion: v1
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT_NAMESPACE}-${ENV_NAME}
      creationTimestamp:
      labels:
        name: ${APP_NAME}
        app: ${APP_NAME}
        env: ${ENV_NAME}
        role: ${ROLE_NAME}
    spec:
      ports:
        - name: 2015-tcp
          protocol: TCP
          port: 2015
          targetPort: 2015
      selector:
        app: ${APP_NAME}
        env: ${ENV_NAME}
        role: ${ROLE_NAME}
      type: ClusterIP
      sessionAffinity: None

  # Configure URL route to the service.
  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT_NAMESPACE}-${ENV_NAME}
      labels:
        name: ${APP_NAME}
        app: ${APP_NAME}
        env: ${ENV_NAME}
        role: ${ROLE_NAME}
    spec:
      host: ${APP_DOMAIN}
      port:
        targetPort: ${APP_PORT}-tcp
      tls:
        insecureEdgeTerminationPolicy: Redirect
        termination: edge
      to:
        kind: Service
        name: ${APP_NAME}
        weight: 100

  # Configure how the pod is deployed.
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: ${APP_NAME}
      namespace: ${PROJECT_NAMESPACE}-${ENV_NAME}
      labels:
        name: ${APP_NAME}
        app: ${APP_NAME}
        env: ${ENV_NAME}
        role: ${ROLE_NAME}
    spec:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: ${APP_NAME}
          env: ${ENV_NAME}
          role: ${ROLE_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            env: ${ENV_NAME}
            role: ${ROLE_NAME}
        spec:
          containers:
            - name: ${APP_NAME}
              image: "image-registry.openshift-image-registry.svc:5000/${PROJECT_NAMESPACE}-tools/${APP_NAME}:${IMAGE_TAG}"
              ports:
                - containerPort: 2015
                  protocol: TCP
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  cpu: ${CPU_LIMIT}
                  memory: ${MEMORY_LIMIT}
              terminationMessagePath: "/dev/termination-log"
              terminationMessagePolicy: File
              imagePullPolicy: Always
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
          securityContext: {}
          schedulerName: default-scheduler
