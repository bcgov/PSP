name: Scheduled Monthly Image Scan

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of every month at 06:00 UTC
  workflow_dispatch: {}

jobs:
  scan-start-notification:
    name: Monthly Scan Start Notification
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
      - name: Notify scan start
        continue-on-error: true
        uses: ./.github/actions/teams-notification
        with:
          webhook-uri: ${{ secrets.MS_TEAMS_WEBHOOK_URI_BUILD_CHANNEL }}
          summary: Monthly Container Image Security Scan STARTED
          title: Monthly Image Scan
          color: 17a2b8
          timezone: America/Los_Angeles

  scan-deployed-and-bases:
    name: Scan Deployed and Base Images
    needs: scan-start-notification
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      OPENSHIFT_NAMESPACE: 3cd915-tools
      OPENSHIFT_REGISTRY: ${{ secrets.OPENSHIFT_REGISTRY }}
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      OC_USERNAME_SA: ${{ secrets.OC_USERNAME_SA }}
      NODEJS20_BASE_TAG: ${{ secrets.NODEJS20_BASE_TAG }}
      NGINX_BASE_TAG: ${{ secrets.NGINX_BASE_TAG }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
      - name: Authenticate OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}

      - name: Docker login to OpenShift registry
        run: echo "${{ env.OPENSHIFT_TOKEN }}" | docker login ${{ env.OPENSHIFT_REGISTRY }} -u unused --password-stdin

      - name: Define images to scan
        id: define
        run: |
          IMAGES=(
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/pims-app:prod"
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/pims-api:prod"
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/pims-proxy:prod"
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/pims-scheduler:prod"
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/dotnet-100:10.0"
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/nodejs-20:1-34"
            "${OPENSHIFT_REGISTRY}/${OPENSHIFT_NAMESPACE}/nginx-runtime:dev"
          )
          printf "%s\n" "${IMAGES[@]}" > images.txt

      - name: Pull images
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r IMG; do
            for attempt in 1 2 3; do
              echo "Pulling $IMG (attempt $attempt/3)"
              if docker pull "$IMG"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "::error::Image pull failed after 3 attempts: $IMG"
                exit 1
              fi

              sleep 10
            done
          done < images.txt

      - name: Scan all images with Trivy
        shell: bash
        run: |
          set -euo pipefail
          # Exclude embedded local-development Dockerfiles from the S2I image scan.
          # Review these files separately; validate deployment non-root settings independently.
          # These exclusions skip all checks on these files, not package vulnerability scans.
          SCAN_FAILED=0
          while IFS= read -r IMG; do
            echo "Scanning $IMG"
            FILENAME="$(echo $IMG | tr '/' '_' | tr ':' '_')"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:b7dc41ff0c3224dea024ee21bb9f6920a8af2fb343bba7139140d8fd0df1bac3 image --skip-files /opt/app-root/src/Dockerfile --skip-files /opt/app-root/src/Dockerfile.proxy --skip-files /opt/app-root/src/Dockerfile.scheduler --exit-code 1 --scanners vuln,secret,misconfig --format table --severity CRITICAL,HIGH "$IMG" | tee "${FILENAME}.txt" || SCAN_FAILED=1
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/workspace" aquasec/trivy@sha256:b7dc41ff0c3224dea024ee21bb9f6920a8af2fb343bba7139140d8fd0df1bac3 image --skip-files /opt/app-root/src/Dockerfile --skip-files /opt/app-root/src/Dockerfile.proxy --skip-files /opt/app-root/src/Dockerfile.scheduler --scanners vuln,secret,misconfig --format sarif --severity CRITICAL,HIGH "$IMG" -o "/workspace/${FILENAME}.sarif"
          done < images.txt
          if [ $SCAN_FAILED -eq 1 ]; then
            echo "One or more scans found CRITICAL/HIGH vulnerabilities or failed to complete. Review the scan logs."
            exit 1
          fi

      - name: Upload SARIF files to Security tab
        if: always()
        run: |
          for sarif in *.sarif; do
            category="monthly-$(echo $sarif | sed 's/_prod_predeploy_scan.sarif//' | sed 's/\.sarif//')"
            # Upload each SARIF individually using codeql-action
          done

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-image-scan-reports
          path: "*.txt"
          retention-days: 90

      - name: Upload SARIF files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-image-scan-sarif-reports
          path: "*.sarif"
          retention-days: 90

  scan-end-notification:
    name: Monthly Scan End Notification to Teams Channel
    runs-on: ubuntu-22.04
    needs: scan-deployed-and-bases
    if: always()
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
      - name: check workflow status
        uses: martialonline/workflow-status@326830cacf79872efe767e15031f58d1ea0508c4 # v4.2
        id: check
      - name: End notification to Teams Channel
        continue-on-error: true
        uses: ./.github/actions/teams-notification
        with:
          webhook-uri: ${{ secrets.MS_TEAMS_WEBHOOK_URI_BUILD_CHANNEL }}
          summary: Monthly Container Image Security Scan COMPLETED with status ${{ steps.check.outputs.status }}. Review scan reports in GitHub Actions artifacts.
          title: Monthly Image Scan
          color: 17a2b8
          timezone: America/Los_Angeles
