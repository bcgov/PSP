name: Site Security Scan

on:
  push:
    branches: [dev]

# Default to source read access; grant additional permissions only in jobs that need them.
permissions:
  contents: read

jobs:
  zap_scan:
    permissions:
      contents: read        # Required for actions/checkout to read repository source
      issues: write         # Required for zaproxy/action-full-scan to create or update scan-report issues
    runs-on: ubuntu-22.04
    name: Scan the web application
    env:
      ZAP_REPORT: zap-report.xml
      HTML_ZAP_REPORT: zap-report.html
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c #v0.13.0
        with:
          target: "https://dev-pims.th.gov.bc.ca/"
          cmd_options: "-r ${{ env.HTML_ZAP_REPORT }} -x ${{ env.ZAP_REPORT }}"
          fail_action: false
