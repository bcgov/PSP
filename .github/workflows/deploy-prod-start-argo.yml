name: PIMS PROD Deployment (ArgoCD)
env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  # service account: gitaction
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_TOOLS_NAMESPACE: "3cd915-tools"
  MS_TEAMS_WEBHOOK_BUILD_CHANNEL: ${{ secrets.MS_TEAMS_WEBHOOK_URI_BUILD_CHANNEL }}
  AUTH__KEYCLOAK__SECRET: ${{ secrets.KEYCLOAK_SECRET_PROD }}
  AUTH__KEYCLOAK__SERVICEACCOUNT__SECRET: ${{ secrets.KEYCLOAK_SERVICEACCOUNT_SECRET }}
  ASPNETCORE_ENVIRONMENT: "prod"

  APP_PORT: 8080
  DESTINATION: "prod"
  OC_JOB_NAME: "master"
  GIT_URL: "${{github.server_url}}/${{github.repository}}"
  GIT_BRANCH: "master"
  APP_NAME: "pims"
  PROJ_PREFIX: "3cd915"
  PROJ_TOOLS: "3cd915-tools"
  PROJ_DEV: "dev"
  PROJ_TEST: "test"
  PROJ_PROD: "prod"
  TAG_DEV: "dev"
  TAG_TEST: "test"
  TAG_PROD: "prod"
  DEPLOYMENT_NAMESPACE: "3cd915-prod"

on:
  workflow_dispatch:
    inputs:
      OVERRIDE_VERSION:
        description: "Enter the version for this release in format <major>.<minor>.<hotfix>.<build> (a leading v is accepted), or enter nothing to use the most recently tagged version"
        required: false
      enable-notifications:
        description: "Send Teams notifications"
        required: false
        type: boolean
        default: true

jobs:
  ci-cd-start-notification:
    name: CI-CD Start Notification to Teams Channel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
      - name: Start notification to Teams Channel
        if: ${{ inputs.enable-notifications }}
        continue-on-error: true
        uses: ./.github/actions/teams-notification
        with:
          webhook-uri: ${{ env.MS_TEAMS_WEBHOOK_BUILD_CHANNEL }}
          summary: PIMS Deployment to PRODUCTION started.
          title: PIMS Deployment PROD
          color: 17a2b8
          timezone: America/Los_Angeles

  deploy:
    name: Deploy frontend and api to OpenShift
    runs-on: ubuntu-22.04
    needs: ci-cd-start-notification
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
        with:
          ref: master
          fetch-depth: 0
      - name: "Get Previous tag"
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@04e8485ecb6487243907e330d522ff60f02283ce # v1.4.0
      - name: Login to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_TOOLS_NAMESPACE }}
      ## The source is now the immutable <version>-uat tag created by
      ## retag-test-to-uat-argo.yml, replacing the previous v<version>-master.
      ## Git tags carry a leading "v" that is not part of the image tag.
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [ -z "${{ github.event.inputs.OVERRIDE_VERSION }}" ]; then
            RAW_VERSION="${{ steps.previoustag.outputs.tag }}"
          else
            RAW_VERSION="${{ github.event.inputs.OVERRIDE_VERSION }}"
          fi

          RELEASE_VERSION="${RAW_VERSION#v}"

          if [ -z "$RELEASE_VERSION" ]; then
            echo "ERROR: could not resolve a release version" >&2
            exit 1
          fi

          IMAGE_VERSION=$(oc -n "$OPENSHIFT_TOOLS_NAMESPACE" get istag "pims-api:${RELEASE_VERSION}-uat" \
            -o jsonpath='{.image.dockerImageMetadata.Config.Env}' 2>/dev/null \
            | jq -r '.[] | select(startswith("PIMS_VERSION=")) | ltrimstr("PIMS_VERSION=")' \
            | tail -1)

          if [ -z "$IMAGE_VERSION" ]; then
            echo "::error::pims-api:${RELEASE_VERSION}-uat not found, or carries no PIMS_VERSION."
            echo "::error::Confirm the release was promoted to UAT before deploying to PROD."
            exit 1
          fi

          if [ "$IMAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::pims-api:${RELEASE_VERSION}-uat was built as ${IMAGE_VERSION}."
            echo "::error::The tag does not match the image content. Refusing to promote."
            exit 1
          fi

          echo "Promoting release version: ${RELEASE_VERSION}"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Display the maintenance page instead of the app
        run: |
          APPLICATION_NAME=pims-app-prod ./tools/cicd/maintenance/maintenance.sh prod on
      - name: Deploy PIMS services
        shell: bash
        run: |
          ./tools/cicd/build/deploy-image.sh \
            --from "${{ steps.release.outputs.version }}-uat" \
            --env prod \
            pims-app pims-api pims-proxy pims-scheduler
      ## mayan-bcgov previously went to a tag named "master" here while the
      ## other four went to "prod". It now uses "prod" like the rest.
      - name: Deploy mayan
        shell: bash
        run: |
          ./tools/cicd/build/deploy-image.sh \
            --from "${{ steps.release.outputs.version }}-uat" \
            --env prod \
            --no-rollout \
            mayan-bcgov
      ## The clean, environment-suffix-free release tag. PROD only.
      - name: Tag production release
        shell: bash
        run: |
          ./tools/cicd/build/tag-version.sh \
            --env prod \
            --version "${{ steps.release.outputs.version }}" \
            --clean \
            pims-app pims-api pims-proxy pims-scheduler mayan-bcgov

  # the command:
  # 1) creates an openshift job with generated name to avoid name conflict, substituting the variables in the template.
  # 2) greps the generated name from the previous step.
  # 3) waits for the job to complete using the generated name.
  database-upgrade:
    name: Upgrade database
    needs: [deploy]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
      - name: Login to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: 3cd915-prod
      - name: call scripts to upgrade database
        shell: bash
        run: |
          JOB_NAME=$(oc process -f ./openshift/4.0/templates/jobs/db-deploy.yaml -p DB_SECRET_NAME=pims-database -p GIT_BRANCH=master -p SERVER_NAME=sqlprd.th.gov.bc.ca -p DB_NAME=PIMS_PRD -p NAMESPACE=3cd915-prod | oc create -f - | grep -oP "(?<=job\.batch/)[^\s]*")
          oc wait --for=condition=complete job/$JOB_NAME --timeout=120s
          oc get pods -o custom-columns=POD:.metadata.name --no-headers | grep -Eo $JOB_NAME-[^\s].* | (read POD_NAME; oc logs $POD_NAME)

  ## Call the mayan sync task three times, once for each mayan sync endpoint. The task will wait for the job to complete before exiting.
  ## Note: this depends on the mayan-sync configmap for the target namespace being up to date.
  mayan-sync:
    name: sync mayan
    needs: database-upgrade
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #6.0.3
      - name: Login to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: 3cd915-prod
      - name: call scripts to sync mayan
        shell: bash
        run: |
          oc process -f ./openshift/4.0/templates/jobs/mayan-sync.yaml -p NAMESPACE=3cd915-prod -p TOKEN_URL=https://loginproxy.gov.bc.ca:443/auth/realms/standard/protocol/openid-connect/token -p CLIENT_ID=property-services-project-api-4380 -p MAYAN_SYNC_URL=https://pims-app-3cd915-prod.apps.silver.devops.gov.bc.ca/api/documents/sync/mayan/metadatatype -p KEYCLOAK_SECRET_NAME=pims-api-sso | oc create -f - | grep -oP "(?<=\/)[^\s]*" | (read TASK_NAME; oc wait --for=condition=succeeded taskruns/$TASK_NAME --timeout=80s)
          oc process -f ./openshift/4.0/templates/jobs/mayan-sync.yaml -p NAMESPACE=3cd915-prod -p TOKEN_URL=https://loginproxy.gov.bc.ca:443/auth/realms/standard/protocol/openid-connect/token -p CLIENT_ID=property-services-project-api-4380 -p MAYAN_SYNC_URL=https://pims-app-3cd915-prod.apps.silver.devops.gov.bc.ca/api/documents/sync/documenttype -p KEYCLOAK_SECRET_NAME=pims-api-sso | oc create -f - | grep -oP "(?<=\/)[^\s]*" | (read TASK_NAME; oc wait --for=condition=succeeded taskruns/$TASK_NAME --timeout=80s)
          oc process -f ./openshift/4.0/templates/jobs/mayan-sync.yaml -p NAMESPACE=3cd915-prod -p TOKEN_URL=https://loginproxy.gov.bc.ca:443/auth/realms/standard/protocol/openid-connect/token -p CLIENT_ID=property-services-project-api-4380 -p MAYAN_SYNC_URL=https://pims-app-3cd915-prod.apps.silver.devops.gov.bc.ca/api/documents/sync/mayan -p KEYCLOAK_SECRET_NAME=pims-api-sso | oc create -f - | grep -oP "(?<=\/)[^\s]*" | (read TASK_NAME; oc wait --for=condition=succeeded taskruns/$TASK_NAME --timeout=80s)

  ## Call the tekton pipeline that executes the keycloak sync. Dependent on the pims-api being accessible. Can run in parallel with the mayan sync.
  keycloak-sync:
    name: sync keycloak
    needs: database-upgrade
    uses: ./.github/workflows/keycloak-sync.yml
    with:
      environment: prod
      branch: master
    secrets: inherit
